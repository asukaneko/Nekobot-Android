name: Compile chat input background fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-input-background
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile and capture result
        shell: bash
        run: |
          set +e
          ./gradlew :app:compileDebugKotlin --no-daemon > /tmp/compile.log 2>&1
          status=$?
          tail -n 160 /tmp/compile.log > .github/chat-input-compile-result.txt
          rm .github/workflows/compile-chat-input-background-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/chat-input-compile-result.txt \
                  .github/workflows/compile-chat-input-background-fix.yml
          git commit -m "chore: record chat input compile result [skip ci]"
          git push origin HEAD:fix/chat-input-background
          exit $status
