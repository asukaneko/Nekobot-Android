name: Compile chat input background fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-input-background
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile debug Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/compile-chat-input-background-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/compile-chat-input-background-fix.yml
          git commit -m "chore: remove temporary compile workflow [skip ci]"
          git push origin HEAD:fix/chat-input-background
