name: Apply modern chat input redesign

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-chat-input:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/modern-chat-input-menu
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Replace chat input and menu
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/kotlin/com/nekobot/app/ui/screens/chat/ChatScreen.kt')
          source = path.read_text(encoding='utf-8')
          start_marker = '@Composable\nprivate fun ChatInputBar('
          end_marker = '/** 操作胶囊按钮'
          start = source.index(start_marker)
          end = source.index(end_marker, start)

