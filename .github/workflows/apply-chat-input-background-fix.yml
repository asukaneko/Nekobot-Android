name: Apply chat input background fix

on:
  push:
    branches:
      - fix/chat-input-background

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-input-background
          fetch-depth: 0

      - name: Use modern composer as the real Scaffold bottom bar
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          chat_path = Path('app/src/main/kotlin/com/nekobot/app/ui/screens/chat/ChatScreen.kt')
          chat = chat_path.read_text(encoding='utf-8')

          old_signature = "fun ChatScreen(sessionId: String, onBack: () -> Unit, onOpenChat: (String) -> Unit = {}, onOpenSessionDetail: (String) -> Unit = {}, onOpenWorkspace: (String) -> Unit = {}, onOpenStoryGraph: (String) -> Unit = {}, externalListState: androidx.compose.foundation.lazy.LazyListState? = null) {"
          new_signature = """fun ChatScreen(
              sessionId: String,
              onBack: () -> Unit,
              onOpenChat: (String) -> Unit = {},
              onOpenSessionDetail: (String) -> Unit = {},
              onOpenWorkspace: (String) -> Unit = {},
              onOpenStoryGraph: (String) -> Unit = {},
              externalListState: androidx.compose.foundation.lazy.LazyListState? = null,
              customBottomBar: (@Composable () -> Unit)? = null
          ) {"""
          if old_signature not in chat:
              raise SystemExit('ChatScreen signature marker not found')
          chat = chat.replace(old_signature, new_signature, 1)

          bottom_start = chat.index('        bottomBar = {\n')
          bottom_end = chat.index('        snackbarHost =', bottom_start)
          bottom = chat[bottom_start:bottom_end]

          selection_marker = '            if (!selectionMode) {\n'
          if selection_marker not in bottom:
              raise SystemExit('bottomBar selection marker not found')
          bottom = bottom.replace(
              selection_marker,
              """            if (!selectionMode) {
                  if (customBottomBar != null) {
                      customBottomBar()
                  } else {
          """,
              1,
          )

          tail = '                )\n            }\n        },\n'
          replacement_tail = '                )\n                }\n            }\n        },\n'
          if tail not in bottom:
              raise SystemExit('bottomBar tail marker not found')
          bottom = bottom.replace(tail, replacement_tail, 1)
          chat = chat[:bottom_start] + bottom + chat[bottom_end:]
          chat_path.write_text(chat, encoding='utf-8')

          modern_path = Path('app/src/main/kotlin/com/nekobot/app/ui/screens/chat/ModernChatScreen.kt')
          modern = modern_path.read_text(encoding='utf-8')
          modern = modern.replace(
              '    val selectionMode by viewModel.selectionMode.collectAsState()\n',
              '',
              1,
          )

          block_start = modern.index('    Box(modifier = Modifier.fillMaxSize()) {\n')
          composer_marker = '\n@Composable\nprivate fun ModernChatComposer'
          composer_index = modern.index(composer_marker, block_start)
          function_close = modern.rfind('\n}', block_start, composer_index)
          if function_close < 0:
              raise SystemExit('ModernChatScreen function closing brace not found')

          replacement = """    ChatScreen(
              sessionId = sessionId,
              onBack = onBack,
              onOpenChat = onOpenChat,
              onOpenSessionDetail = onOpenSessionDetail,
              onOpenWorkspace = onOpenWorkspace,
              onOpenStoryGraph = onOpenStoryGraph,
              externalListState = listState,
              customBottomBar = {
                  ModernChatComposer(
                      modifier = Modifier.fillMaxWidth(),
                      sessionId = sessionId,
                      messages = messages,
                      sending = sending,
                      plotChoices = plotChoices,
                      plotChoicesLoading = plotChoicesLoading,
                      onSend = { text, plotChoiceId -> viewModel.sendMessage(text, plotChoiceId) },
                      onStop = viewModel::stop,
                      onCompress = viewModel::compressContext,
                      onClear = { viewModel.clearMessages(sessionId) },
                      onRegeneratePlotChoices = viewModel::regeneratePlotChoices,
                      onOpenWorkspace = { onOpenWorkspace(sessionId) },
                      onJumpToLatest = onJumpToLatest,
                      onJumpToMessage = { msg ->
                          val idx = messages.indexOfFirst { it.id == msg.id }
                          if (idx >= 0) composerScope.launch { listState.animateScrollToItem(idx + 1) }
                      }
                  )
              }
          )"""
          modern = modern[:block_start] + replacement + modern[function_close:]
          modern_path.write_text(modern, encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/apply-chat-input-background-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/kotlin/com/nekobot/app/ui/screens/chat/ChatScreen.kt \
                  app/src/main/kotlin/com/nekobot/app/ui/screens/chat/ModernChatScreen.kt \
                  .github/workflows/apply-chat-input-background-fix.yml
          git commit -m "fix: remove duplicate chat input background [skip ci]"
          git push origin HEAD:fix/chat-input-background
